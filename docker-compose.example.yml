name: yourss

services:
  yourss:
    image: ghcr.io/ridoc/yourss:latest
    container_name: yourss
    restart: unless-stopped
    user: "999:999"
    env_file: .env
    environment:
      YOURSS_DB_PATH: /data/db/yourss.db
      YOURSS_CACHE_FOLDER: /data/cache
      YOURSS_NOINDEX: "true"
      # One-time import; uncomment only when ./config/users.yaml exists.
      # YOURSS_USERS_FILE: /data/config/users.yaml
    volumes:
      - ./data/db:/data/db
      - ./data/cache:/data/cache
      - ./data/backup:/data/backup
      - ./config:/data/config:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
