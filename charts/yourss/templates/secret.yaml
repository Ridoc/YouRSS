apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yourss.fullname" . }}-env
  labels:
    {{- include "yourss.labels" . | nindent 4 }}
type: Opaque
stringData:
  YOURSS_SECRET_KEY: {{ .Values.yourss.secretKey | quote }}
  YOURSS_SMTP_PASSWORD: {{ .Values.yourss.smtp.password | quote }}
  YOURSS_TURNSTILE_SECRET_KEY: {{ .Values.yourss.turnstile.secretKey | quote }}
---
{{- if .Values.yourss.users }}
# The application reads this file on every request: an update needs no restart
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yourss.fullname" . }}-users
  labels:
    {{- include "yourss.labels" . | nindent 4 }}
stringData:
  users.yaml: |
    users:
      {{- toYaml .Values.yourss.users | nindent 6 }}
{{- end }}
