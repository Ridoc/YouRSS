apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yourss.fullname" . }}
  labels:
    {{- include "yourss.labels" . | nindent 4 }}
spec:
  {{- if or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1) }}
  {{- fail "SQLite: one writer only — keep replicaCount=1 and autoscaling.enabled=false" }}
  {{- end }}
  {{- if and .Values.ingress.enabled (eq (toString .Values.yourss.forwardedAllowIps) "127.0.0.1") }}
  {{- fail "ingress.enabled requires yourss.forwardedAllowIps = the ingress controller/pod CIDR" }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  # WHY: SQLite is single-writer; a surge pod would mount the same RWO volume and race migrations/warm-up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "yourss.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "yourss.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "yourss.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.yourss.image.repository }}:{{ .Values.yourss.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.yourss.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.yourss.timezone | quote }}
            - name: LOGURU_LEVEL
              value: {{ .Values.yourss.logLevel | quote }}
            - name: YOURSS_CUSTOM_PAGES_ENABLED
              value: {{ .Values.yourss.customPagesEnabled | quote }}
            - name: YOURSS_MAX_PAGE_ITEMS
              value: {{ .Values.yourss.maxPageItems | quote }}
            - name: YOURSS_API_DOCS_ENABLED
              value: {{ .Values.yourss.apiDocsEnabled | quote }}
            - name: YOURSS_CLEAN_TITLES
              value: {{ .Values.yourss.cleanTitles | quote }}
            - name: YOURSS_CACHE_ENABLED
              value: {{ .Values.yourss.cacheEnabled | quote }}
            {{- with .Values.yourss.cacheFolder }}
            - name: YOURSS_CACHE_FOLDER
              value: {{ . | quote }}
            {{- end }}
            - name: YOURSS_CACHE_RSS_TTL
              value: {{ .Values.yourss.cacheRssTtl | quote }}
            {{- if .Values.yourss.warmupEnabled }}
            - name: YOURSS_WARMUP_ENABLED
              value: "true"
            {{- end }}
            - name: YOURSS_CACHE_RSS_FALLBACK_TTL
              value: {{ .Values.yourss.cacheRssFallbackTtl | quote }}
            - name: YOURSS_CACHE_METADATA_TTL
              value: {{ .Values.yourss.cacheMetadataTtl | quote }}
            - name: YOURSS_LOGIN_TTL
              value: {{ .Values.yourss.loginTtl | quote }}
            - name: YOURSS_DB_PATH
              value: {{ .Values.yourss.dbPath | quote }}
            - name: YOURSS_PUBLIC_BASE_URL
              value: {{ .Values.yourss.publicBaseUrl | quote }}
            - name: YOURSS_REGISTRATION_ENABLED
              value: {{ .Values.yourss.registrationEnabled | quote }}
            - name: YOURSS_SESSION_TTL
              value: {{ .Values.yourss.sessionTtl | quote }}
            - name: YOURSS_PRIVATE
              value: {{ .Values.yourss.private | quote }}
            - name: YOURSS_NOINDEX
              value: {{ .Values.yourss.noindex | quote }}
            - name: YOURSS_ADMIN_EMAIL
              value: {{ .Values.yourss.adminEmail | quote }}
            - name: YOURSS_ADMIN_USERNAME
              value: {{ .Values.yourss.adminUsername | quote }}
            - name: YOURSS_MAX_PAGES_PER_USER
              value: {{ .Values.yourss.maxPagesPerUser | quote }}
            - name: YOURSS_MAX_PAGE_SUBSCRIPTIONS
              value: {{ .Values.yourss.maxPageSubscriptions | quote }}
            - name: YOURSS_FORWARDED_ALLOW_IPS
              value: {{ .Values.yourss.forwardedAllowIps | quote }}
            - name: YOURSS_IMPORT_EXPECT_PAGES
              value: {{ .Values.yourss.importExpectPages | quote }}
            - name: YOURSS_IMPORT_EXPECT_SUBS
              value: {{ .Values.yourss.importExpectSubs | quote }}
            - name: YOURSS_VIDEO_DURATIONS
              value: {{ .Values.yourss.videoDurations | quote }}
            - name: YOURSS_DURATION_TTL
              value: {{ .Values.yourss.durationTtl | quote }}
            - name: YOURSS_SMTP_HOST
              value: {{ .Values.yourss.smtp.host | quote }}
            - name: YOURSS_SMTP_PORT
              value: {{ .Values.yourss.smtp.port | quote }}
            - name: YOURSS_SMTP_USER
              value: {{ .Values.yourss.smtp.username | quote }}
            - name: YOURSS_SMTP_STARTTLS
              value: {{ .Values.yourss.smtp.starttls | quote }}
            - name: YOURSS_SMTP_SSL
              value: {{ .Values.yourss.smtp.ssl | quote }}
            - name: YOURSS_SMTP_FROM
              value: {{ .Values.yourss.smtp.from | quote }}
            - name: YOURSS_TURNSTILE_SITE_KEY
              value: {{ .Values.yourss.turnstile.siteKey | quote }}
            - name: YOURSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "yourss.fullname" . }}-env
                  key: YOURSS_SECRET_KEY
            - name: YOURSS_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yourss.fullname" . }}-env
                  key: YOURSS_SMTP_PASSWORD
            - name: YOURSS_TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "yourss.fullname" . }}-env
                  key: YOURSS_TURNSTILE_SECRET_KEY
            {{- if .Values.yourss.users }}
            - name: YOURSS_USERS_FILE
              value: /yourss/users.yaml
            {{- else if .Values.yourss.usersFile }}
            - name: YOURSS_USERS_FILE
              value: {{ .Values.yourss.usersFile | quote }}
            {{- end }}
            {{- with .Values.yourss.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              # WHY: /healthz can be 503 on a transient DB/cache problem; liveness must not restart the pod.
              path: /api/version
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-db
              mountPath: /data/db
            - name: data-cache
              mountPath: /data/cache
            - name: data-backup
              mountPath: /data/backup
            {{- if .Values.yourss.users }}
            - name: users
              mountPath: /yourss
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-db
          {{- if .Values.persistence.db.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.db.existingClaim | default (printf "%s-db" (include "yourss.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: data-cache
          emptyDir: {}
        - name: data-backup
          {{- if .Values.persistence.backup.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.backup.existingClaim | default (printf "%s-backup" (include "yourss.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.yourss.users }}
        - name: users
          secret:
            secretName: {{ include "yourss.fullname" . }}-users
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
