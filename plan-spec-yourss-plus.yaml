      - "Signup username: derive from email local part, regex ^[a-z0-9][a-z0-9_-]{2,31}$, reserved names (admin,api,auth,account,login,logout,static,healthz,robots,favicon,u,p,root,yourss), deterministic -2/-3 collision suffix; test collision and reserved."
