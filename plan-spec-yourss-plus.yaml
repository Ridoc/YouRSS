# YouRSS+ implementation plan
---
plan: "yourss-plus"
title: "YouRSS+ — accounts, self-service subscriptions, issue fixes"
version: "1.1"
status: "ROUND 10 FIXED — critique round 11 pending"
created: "2026-11-20"
target_repo: "/mnt/NAS-Zeno/OpenCode/YouRSS-app"
target_repo_name: "Ridoc/YouRSS"
deployment_repo: "/mnt/NAS-Zeno/OpenCode/YouRSS"
spec: "/mnt/NAS-Zeno/OpenCode/YouRSS-app/docs/superpowers/specs/2026-11-20-yourss-fork-design.md"
product_name: "YouRSS+"
upstream: "essembeh/YouRSS"
license: "Apache-2.0"
critique_required: true

ARCHITECTURE:
  A1_DECISIONS:
    - id: A1.1
      decision: "Extend upstream in place; keep FastAPI/Jinja/htmx and upstream tests."
    - id: A1.2
      decision: "SQLite (WAL) is the live store; users.yaml is a one-time import source."
    - id: A1.3
      decision: "Passwordless magic-link accounts; editable username slug; /u/zeno preserved."
    - id: A1.4
      decision: "Open registration on yourss.occupysaas.net; anonymous URL pages remain."
    - id: A1.5
      decision: "Watched state syncs server-side for logged-in users; localStorage stays for anonymous."
    - id: A1.6
      decision: "No local likes; keep YouTube embed controls and add a Like on YouTube link."
    - id: A1.7
      decision: "SMTP only for mail; Cloudflare Turnstile when configured."
    - id: A1.8
      decision: "Public fork Ridoc/YouRSS; CI image ghcr.io/ridoc/yourss; product display name YouRSS+."
    - id: A1.9
      decision: "Old yourss.5circles.eu is decommissioned after migration; 301 window first."
  A2_INVARIANTS:
    - id: A2.1
      rule: "Anonymous URL pages (/UC…,PL…, /p/<name>) keep working exactly as today unless YOURSS_PRIVATE is enabled."
    - id: A2.2
      rule: "Every mutating request requires CSRF; every user-data query is scoped by user_id unless admin."
    - id: A2.3
      rule: "No secrets in git, docs, logs, or chat; DB mode 0600."
    - id: A2.4
      rule: "One uvicorn worker in examples; SQLite writes serialize; warm-up runs once."
    - id: A2.5
      rule: "`just check` and `just test` pass after every batch; upstream suite stays green."
    - id: A2.6
      rule: "Media stays pass-through; no proxying or storing thumbnails, video, or YouTube cookies."
    - id: A2.7
      rule: "Product name is YouRSS+ in UI/docs; Python package stays `yourss`; upstream attribution stays."
  COMPONENT_MAP:
    C1: "Persistence and configuration: SQLite, migrations, settings, secret bootstrap."
    C2: "Auth and accounts: magic links, SMTP, Turnstile, sessions, CSRF, rate limits, admin bootstrap."
    C3: "Subscriptions and pages: repository, validation, CRUD, import, permissions, admin UI."
    C4: "Watched sync: server map, API, localStorage bridge, account UI."
    C5: "Security and ops issues #4-#16 plus durations (#17): private mode, 404, healthz, robots, forwarded headers, warm-up status, duration cache."
    C7: "Delivery: CI image, Docker, compose, Helm, migration runbook, public rollout, decommission."
  DATA_FLOW:
    - "Browser -> Cloudflare/Caddy -> nginx -> FastAPI."
    - "FastAPI -> SQLite (accounts/pages/subscriptions/watched/tokens)."
    - "FastAPI -> disk cache (RSS/metadata/durations)."
    - "FastAPI -> SMTP (magic links)."
  EXTERNAL_CONTRACTS:
    - "Upstream routes /, /u/<user>, /u/<user>/<page>, /p/<page>, /htmx/*, /api/resolve stay compatible; mutations require CSRF, including legacy POST /u/*."
    - "Legacy users.yaml schema (users/pages/channels/password/publish/warmup) imports without data loss."
    - "Docker image exposes 8000 only; healthcheck at /healthz; no published host port in examples."

COMPONENTS:
  C1:
    id: C1
    responsibility: "SQLite schema, migrations, settings, DB/secret bootstrap."
    depends_on: []
    in_contract: "YOURSS_DB_PATH, YOURSS_SECRET_KEY, AppSettings."
    out_contract: "async connection helpers, migrate(), get_setting(), secret_key()."
    failure_modes: "unwritable DB -> startup fails clearly; missing secret -> generated once with warning."
    items:
      - id: C1.I1
        batch: BATCH_1
      - id: C1.I2
        batch: BATCH_2
  C2:
    id: C2
    responsibility: "Magic-link auth, sessions, CSRF, rate limits, Turnstile, SMTP, legacy password bridge."
    depends_on: [C1]
    in_contract: "users/login_tokens/settings tables; SMTP/Turnstile config."
    out_contract: "request_login(), verify_login(), current_user dependency, require_user, require_admin, csrf_token/validate_csrf."
    failure_modes: "SMTP down -> login request still 200 but logged error; Turnstile fail-closed when configured."
    items:
      - id: C2.I1
        batch: BATCH_3
  C3:
    id: C3
    responsibility: "Pages/subscriptions repository, import, CRUD UI, admin users, permissions."
    depends_on: [C1, C2]
    in_contract: "pages/subscriptions tables; existing YoutubeApi.resolve endpoints."
    out_contract: "list_pages(), create_page(), update_page(), delete_page(), add_subscription(), remove_subscription(), reorder_subscriptions(), import_users_file(), list_warmup_pages()."
    failure_modes: "bad ref -> 422 with friendly message; duplicate -> 409; read path never 500s."
    items:
      - id: C3.I1
        batch: BATCH_4
  C4:
    id: C4
    responsibility: "Server-side watched state and cross-device sync."
    depends_on: [C1, C2]
    in_contract: "watched table; session user; existing localStorage map."
    out_contract: "get_watched_map(), add_watched(), remove_watched(), import_local_watched()."
    failure_modes: "anonymous -> localStorage only; logged-in -> server authoritative after import."
    items:
      - id: C4.I1
        batch: BATCH_5
  C5:
    id: C5
    responsibility: "Issues #4-#16: private mode, CSRF coverage, rate limits, 404, healthz, robots, forwarded headers, warm-up status, validation."
    depends_on: [C1, C2, C3]
    in_contract: "YOURSS_PRIVATE, YOURSS_NOINDEX, YOURSS_FORWARDED_ALLOW_IPS, cache/warm-up."
    out_contract: "/healthz, /robots.txt, catch-all 404, private-mode dependency, warmup_status rows."
    failure_modes: "private mode misconfig -> fail closed; healthz 503 on DB/cache failure."
    items:
      - id: C5.I1
        batch: BATCH_6
      - id: C5.I2
        batch: BATCH_7
  C7:
    id: C7
    responsibility: "CI/CD, Docker image, compose example, backup, migration runbook, rollout/decommission."
    depends_on: [C1, C2, C3, C4, C5]
    in_contract: "Fork repo; deployment repo; Cloudflare/Caddy/nginx; SMTP/Turnstile secrets."
    out_contract: "ghcr.io/ridoc/yourss image; docker-compose.example.yml; runbook; live public instance."
    failure_modes: "image pull/auth failure -> deploy stops; migration mismatch -> rollback to users.yaml."
    items:
      - id: C7.I1
        batch: BATCH_8

