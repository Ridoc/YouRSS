RISKS:
  - id: R1
    risk: "Upstream drift while adding auth/DB."
    detect: "`git merge upstream/main` conflicts; tests fail."
    mitigate: "Modular new files; merge before P1; monthly merge."
  - id: R2
    risk: "SMTP deliverability blocks magic links."
    detect: "Test send fails; links land in spam; SMTP 5xx."
    mitigate: "SPF/DKIM/DMARC; dev log mode; test before launch; fallback admin link."
  - id: R3
    risk: "Open registration abuse."
    detect: "Signup spikes; fake accounts; SMTP volume."
    mitigate: "Turnstile + IP/email throttles + nginx/Cloudflare; admin disable/delete."
  - id: R4
    risk: "SQLite lock or corruption under concurrent writes."
    detect: "database is locked; 500s; WAL errors."
    mitigate: "One worker, short transactions, busy_timeout, .backup, integrity_check."
  - id: R5
    risk: "Duration scraping hits YouTube rate limits."
    detect: "Scrape 429/404 spikes; slow warm-up."
    mitigate: "Channel-page granularity, long TTL, feature flag off, silent fallback."
  - id: R6
    risk: "Migration loses folders/publish names/passwords."
    detect: "Import counts mismatch; /u/zeno 404; login fails."
    mitigate: "Temp DB import, verify 12 pages/149 subscriptions/73 unique, keep users.yaml backup, rollback."
  - id: R7
    risk: "CSRF/auth regression opens mutations."
    detect: "Security review/tests; manual POST without token."
    mitigate: "Central dependency, tests on every mutation, security-reviewer gate."
  - id: R8
    risk: "Embedded YouTube like control unavailable on some clients."
    detect: "Browser QA shows no like button."
    mitigate: "Explicit Like on YouTube link; no local like state."

ROLLBACK:
  - "Per batch: no per-batch git commit exists; roll back by redeploying the previous image tag and restoring the DB backup taken before the batch."
  - "Before each schema-changing batch: `sqlite3 /data/db/yourss.db '.backup /data/backup/yourss-<batch>.db'`; /data/backup is created in the image and mounted host-backed; retain until the next batch passes."
  - "Migration: stop app, restore `/data/db/yourss.db` from `/data/backup/yourss-<batch>.db`, restart previous image; users.yaml untouched."
