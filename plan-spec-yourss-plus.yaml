      - "routers/auth.py: GET/POST /login, POST /auth/request, GET/POST /auth/verify, POST /logout; GET /auth/verify issues a CSRF token/cookie so a fresh browser can POST."
      - "routers/auth.py: validate the post-verify next target as a local path only; reject //evil.com and absolute URLs; when REGISTRATION_ENABLED=false, unknown emails get the same generic response and no account is created at request or verify."
      - "security.py: legacy password/Basic bridge only; HMAC key is YOURSS_SECRET_KEY/settings key; include the password hash in the signed message, not in the key, so password changes still invalidate; session cookie HttpOnly, SameSite=Lax, Secure when PUBLIC_BASE_URL is https."
