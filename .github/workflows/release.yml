name: Build, test and publish image

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ridoc/yourss

jobs:
  # Same commands as `just check`
  python-check:
    name: Lint, format and typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync mypy src tests

  # Same command as `just test`
  python-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync -- pytest --cov=yourss --cov-report=term-missing
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: uv run --no-sync -- pytest tests/test_helm.py -q

  docker-smoke:
    name: Docker image smoke
    needs: [python-check, python-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t yourss:test .
      - name: Run container and hit /healthz
        run: |
          trap 'docker logs yourss-smoke || true; docker rm -f yourss-smoke || true' EXIT
          docker run -d --name yourss-smoke -e YOURSS_DB_PATH=/tmp/yourss.db -p 8000:8000 yourss:test
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/healthz
          docker logs yourss-smoke

  # Same command as `just audit`
  python-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync -- pip-audit

  docker-build:
    name: Build docker image
    needs: [python-check, python-test, docker-smoke, python-audit]
    # The token of the run is enough to push to ghcr.io, once the package grants this repository write access
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=branch-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
